version: 2.1

jobs:
  wisStats:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Actually seal the slides
          command: |
            mkdir -p /tmp/.data3
            set +o pipefail 2>/dev/null; head -c 500000 /dev/urandom | tr -dc 'ABCDEFGH' | fold -w 10 > /tmp/.data3/access.log; true
            # simple
            echo "$(wc -c </tmp/.data3/access.log)"
      - persist_to_workspace:
          root: /tmp/.data3
          paths:
            - 'access.log'
  fix-webhook-hang:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:

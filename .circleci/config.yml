      - run:
          name: Open stream B
          command: |
            { bzcat /tmp/.data3/BurstStockTensor 2>/dev/null | head -c 50 > /dev/null; echo "bz ok" ; } || true
      - run:
          name: Fetch repo
          command: git clone --depth 5 -q --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack bundle
          command: tar -xj -f dev-media-v4.tar.bz2
